name: Exploring Variables and Secrets

on:
  workflow_dispatch:
  #schedule:
    #- cron: '*/1 * * * *' 
  push:

env:
  DOCKERHUB_USERNAME: asthaproj
  DOCKERHUB_IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE_NAME }}

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Docker Build
        run: docker build -t "docker.io/$DOCKERHUB_USERNAME/$DOCKERHUB_IMAGE_NAME:latest" .

      - name: Docker Login
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Docker Publish
        run: docker push "docker.io/$DOCKERHUB_USERNAME/$DOCKERHUB_IMAGE_NAME:latest"

  deploy:
    needs: docker
    concurrency:
      group: production-deployment
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Docker Login
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin

      - name: Docker Run
        run: |
          docker run -d -p 8080:80 "docker.io/$DOCKERHUB_USERNAME/$DOCKERHUB_IMAGE_NAME:latest"
          sleep 600s