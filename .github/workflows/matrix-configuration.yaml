name: Matrix Configuration

on:
  push:
  workflow_dispatch:

jobs:
  deploy:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        image: [hello-world, alpine, busybox]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Show OS and Docker details
        run: |
          echo "Runner OS: ${{ runner.os }}"
          echo "Runner label: ${{ matrix.os }}"
          echo "Container image: ${{ matrix.image }}"
          docker --version
          docker info

      - name: Inspect container image
        run: |
          docker image pull "${{ matrix.image }}"
          docker image inspect "${{ matrix.image }}" --format 'ID={{.Id}} OS={{.Os}} ARCH={{.Architecture}} DIGESTS={{json .RepoDigests}}'

      - name: Run container image
        run: docker run --rm "${{ matrix.image }}"
