name: Matrix Configuration

on:
  push:
  workflow_dispatch:

jobs:
  deploy
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, ubuntu-20.0.4]
        images: [hello-world, alpine, busybox]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Echo Docker Details
        run: docker info

      - name: Run Images
        run: docker run ${{ matrix.images }} echo "Hello from ${{ matrix.images }} on ${{ matrix.os }}"

  