name: Workflow Filters and Activities

on:
  workflow_dispatch:
  # schedule:
  #   - cron: "*/59 * * * *"
  push:
    branches:
      - main
      - "!feature/*"
    # branches-ignore:
    #   - "feature/*"
    #   - "test/**"

  pull_request:
    types:
      - opened
      - closed
    paths-ignore:
      - README.md
    branches:
      - main

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Show trigger information
        run: |
          echo "Workflow triggered by: ${{ github.event_name }}"
          echo "Branch or ref: ${{ github.ref }}"